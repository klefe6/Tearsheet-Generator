# Minimal, deliberately conservative pytest configuration (added in the
# smoke-harness PR; see docs/REPO_MAP.md section 6).
#
# testpaths keeps a bare `pytest` invocation inside tests/ — without it,
# collection from the repo root would also import root-level ad-hoc scripts
# like test_read_excel.py (which reads a machine-local workbook at import).
#
# WARNING: do NOT run the entire tests/ directory in one process. Several
# purity tests assert tkp_ts/tcp_ts are absent from sys.modules and fail if
# an earlier test file imported them. Run per-file groups instead:
#   .venv310\Scripts\python.exe -m pytest tests/<file> -q
[pytest]
testpaths = tests
# Keep pytest temp under the repo (writable on locked-down Windows profiles)
# without weakening per-test isolation.
addopts = --basetemp=tests/_pytest_tmp
markers =
    local_workbook: requires local tcp_alex.xlsx at configured absolute path
    smoke: lightweight app import/layout smoke checks
