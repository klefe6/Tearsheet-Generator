[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    fast: unit or contract tests suitable for frequent development runs
    integration: end-to-end acceptance, persistence, import/reload, or seed workflows
    workbook: requires the local tcp_alex.xlsx workbook
    network: may perform or simulate external network retrieval
    browser: layout/responsive parity contracts that emulate browser constraints
    local_workbook: legacy alias for workbook-scoped golden fixture checks
